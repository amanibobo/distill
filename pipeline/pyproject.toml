[project]
name = "distill-pipeline"
version = "0.1.0"
description = "NISAR change detection for Distill"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=2.7.0",
    "asf-search>=14.1.0",
    "earthaccess>=0.19.0",
    "fsspec>=2026.9.0",
    "geopandas>=1.2.0",
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "planetary-computer>=1.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "python-dotenv>=1.2.4",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "rioxarray>=0.23.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.setuptools]
packages = ["distill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
